# Generates the contribution-grid snake and publishes it to the `output` branch.
# README reads: raw.githubusercontent.com/FlynnBui399/FlynnBui399/output/github-snake{,-dark}.svg

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Navy + cyan palette: empty cell first, then 4 contribution levels
          outputs: |
            dist/github-snake.svg?color_snake=#0D1B2A&color_dots=#ebedf0,#b2f1ec,#5fe3d9,#00b3a8,#00807a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D4C8&color_dots=#161b22,#0e3b3d,#00706b,#00a89f,#00D4C8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
