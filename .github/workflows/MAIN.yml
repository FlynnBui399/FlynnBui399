# Generates the contribution-grid snake and publishes it to the `output` branch.
# README reads: raw.githubusercontent.com/FlynnBui399/FlynnBui399/output/github-snake{,-dark}.svg

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # X-ray palette (film + amber): empty cell first, then 4 contribution levels
          outputs: |
            dist/github-snake.svg?color_snake=#0A0F14&color_dots=#ebedf0,#ffe3a3,#ffc94d,#f0a500,#a87300
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFB000&color_dots=#0F161D,#3d2e06,#7a5800,#c08600,#FFB000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
