# Generates the stats cards, then publishes them to the `output` branch.
# README reads: raw.githubusercontent.com/FlynnBui399/FlynnBui399/output/{stats,top-langs}.svg

name: Generate Profile Cards

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The public github-readme-stats Vercel instance is unreliable, so cards are built here.
      # fail_on_error stops the run on API errors, keeping the last good cards on `output`.
      # Colors follow the abyss zone of the ocean theme (scripts/build_ocean_svgs.py).
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&rank_icon=github&bg_color=071C2E&title_color=5EEAD4&icon_color=5EEAD4&text_color=C9E6F0&ring_color=5EEAD4&border_color=10324D&border_radius=20
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&langs_count=6&hide=html,css&bg_color=071C2E&title_color=5EEAD4&text_color=C9E6F0&border_color=10324D&border_radius=20
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
